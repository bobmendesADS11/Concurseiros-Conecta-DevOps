# Workflow 2 — Continuous Deployment no EC2
# Dispara quando o workflow CI/CD termina com sucesso na branch main
# (ou manualmente pela aba Actions). Conecta no EC2 por SSH e atualiza a aplicação.
name: CD - Deploy no EC2

on:
  workflow_run:
    workflows: ['CI/CD']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy na instância EC2
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Atualizar a aplicação no servidor
        run: |
          ssh -i ~/.ssh/ec2.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "bash ~/concurseiros/deploy/deploy.sh ${{ github.event.workflow_run.head_sha || github.sha }}"

      - name: Conferir se o site está no ar
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "http://${{ secrets.EC2_HOST }}/api/health"; then echo; echo "Aplicação no ar!"; exit 0; fi
            sleep 3
          done
          echo "A aplicação não respondeu" && exit 1

      # Teste de fumaça: roda o Selenium no site publicado no EC2.
      # Pega erros que só aparecem no servidor de verdade
      # (como o bug da porta 3000).
      - name: Baixar o código para o teste de fumaça
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Instalar o Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar as dependências do teste
        working-directory: backend
        run: npm ci

      - name: Teste de fumaça (Selenium no site do EC2)
        working-directory: backend
        env:
          APP_URL: http://${{ secrets.EC2_HOST }}
        run: npm run test:e2e
