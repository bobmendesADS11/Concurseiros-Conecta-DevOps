# Workflow 2 — Continuous Deployment no EC2
# Dispara quando o workflow CI/CD termina com sucesso na branch main
# (ou manualmente pela aba Actions). Conecta no EC2 por SSH e atualiza a aplicação.
name: CD - Deploy no EC2

on:
  workflow_run:
    workflows: ['CI/CD']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy na instância EC2
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Atualizar a aplicação no servidor
        run: |
          ssh -i ~/.ssh/ec2.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "bash ~/concurseiros/deploy/deploy.sh ${{ github.event.workflow_run.head_sha || github.sha }}"

      - name: Conferir se o site está no ar
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "http://${{ secrets.EC2_HOST }}/api/health"; then echo; echo "Aplicação no ar!"; exit 0; fi
            sleep 3
          done
          echo "A aplicação não respondeu" && exit 1
